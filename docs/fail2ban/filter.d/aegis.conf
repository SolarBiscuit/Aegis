# fail2ban filter for Aegis's security log (logs/aegis-security.log, written when security.blockLog=true).
#
# Line format (fixed, see docs/security.md):
#   2026-11-05T14:01:00-0500 reason=OVERSIZED_FRAME ip=203.0.113.7 count=1 detail="3145728 bytes, limit 2097151"
#
# Matches protocol offences (no real client sends these) and BANNED (an address that keeps connecting while Aegis
# already refuses it). THROTTLE_RATE / THROTTLE_PENDING are left out on purpose: many players behind one NAT can hit
# them now and then. Add them to the list if your server never has players sharing an address.

[Definition]
failregex = reason=(?:BANNED|BAD_FRAME|OVERSIZED_FRAME|BAD_COMPRESSION|COMPRESSION_BOMB|PRESET_DICTIONARY) ip=<HOST>(?: |$)
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
