# fail2ban jail for Aegis. Copy to /etc/fail2ban/jail.d/aegis.conf and the filter to /etc/fail2ban/filter.d/aegis.conf.
# Set logpath to your server's logs/aegis-security.log and port to your server port.
#
# Aegis writes at most one line per address and reason every 10 seconds, and bans an offender itself for
# security.offenceBanSeconds (60 by default). An address that keeps sending garbage or keeps reconnecting while banned
# produces a line about every 10 s, so 3 lines in 2 minutes means it did not stop; fail2ban then blocks it in the
# firewall, before it reaches Java at all.

[aegis]
enabled  = true
filter   = aegis
logpath  = /srv/minecraft/logs/aegis-security.log
port     = 25565
protocol = tcp
maxretry = 3
findtime = 120
bantime  = 3600
